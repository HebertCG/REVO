name: CI REVO

on:
  push:
    branches:
      - main
      - stating
      - WilsonCollantesAponte
      - AlexisMH30
      - SolanoDieg0
      - stevenferive
      - 'codex/**'
  pull_request:
    branches: [stating, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flujo-ramas:
    name: Flujo de ramas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar historial para comparar ramas
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probar las reglas de integracion
        run: node --test .github/scripts/validar-ramas.test.mjs

      - name: Comprobar origen del PR y conflictos con stating
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.ref_name }}
          BASE_PR: ${{ github.base_ref }}
          ORIGEN_PR: ${{ github.head_ref }}
          REPO_PR: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/validar-ramas.mjs

  unitarias-frontend:
    name: Unitarias - Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar unitarias
        working-directory: frontend
        run: npm run prueba:unidad

  unitarias-backend:
    name: Unitarias - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: comun
            directory: services/comun
            requirements: none

          - name: auth
            directory: services/auth-service
            requirements: services/auth-service/requirements.txt

          - name: survey
            directory: services/survey-service
            requirements: services/survey-service/requirements.txt

          - name: ml
            directory: services/ml-service
            requirements: services/ml-service/requirements.txt

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar libreria comun
        run: python -m pip install -e "./services/comun[test]"

      - name: Instalar dependencias del servicio
        if: matrix.requirements != 'none'
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Ejecutar unitarias
        working-directory: ${{ matrix.directory }}
        run: python -m pytest -q

  e2e-frontend:
    name: E2E - Frontend
    needs:
      - unitarias-frontend
      - unitarias-backend

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E
        working-directory: frontend
        run: npm run prueba:e2e

  integracion-backend:
    name: Integracion - ${{ matrix.name }}
    needs:
      - e2e-frontend

    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            directory: services/auth-service
            requirements: services/auth-service/requirements.txt
            database_user: revo_auth

          - name: survey
            directory: services/survey-service
            requirements: services/survey-service/requirements.txt
            database_user: revo_survey

          - name: ml
            directory: services/ml-service
            requirements: services/ml-service/requirements.txt
            database_user: revo_ml

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: revo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REVO_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revo_test
      REVO_TEST_DATABASE_URL: postgresql://${{ matrix.database_user }}:revo_ci_password@localhost:5432/revo_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar libreria comun
        run: python -m pip install -e "./services/comun[test]"

      - name: Instalar dependencias del servicio
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Preparar PostgreSQL efimero
        run: python pruebas/integracion/preparar_postgres.py

      - name: Ejecutar pruebas de integracion
        working-directory: ${{ matrix.directory }}
        run: python -m pytest pruebas/integracion -q -ra

  construccion-docker:
    name: Docker - ${{ matrix.name }}
    needs:
      - integracion-backend

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pasarela
            context: .
            dockerfile: infraestructura/pasarela/Dockerfile
            runtime_user: ""

          - name: auth
            context: services
            dockerfile: services/auth-service/Dockerfile
            runtime_user: revo

          - name: survey
            context: services
            dockerfile: services/survey-service/Dockerfile
            runtime_user: revo

          - name: ml
            context: services
            dockerfile: services/ml-service/Dockerfile
            runtime_user: revo

          - name: postgres
            context: infraestructura/postgres
            dockerfile: infraestructura/postgres/Dockerfile
            runtime_user: ""

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Construir imagen
        run: >-
          docker build --pull
          --tag "revo-${{ matrix.name }}:ci"
          --file "${{ matrix.dockerfile }}"
          "${{ matrix.context }}"

      - name: Verificar usuario sin privilegios
        if: matrix.runtime_user != ''
        env:
          IMAGEN: revo-${{ matrix.name }}:ci
          USUARIO_ESPERADO: ${{ matrix.runtime_user }}
        run: test "$(docker image inspect --format '{{.Config.User}}' "$IMAGEN")" = "$USUARIO_ESPERADO"

  validacion-completa:
    name: Validacion completa
    if: always()
    needs:
      - flujo-ramas
      - unitarias-frontend
      - unitarias-backend
      - e2e-frontend
      - integracion-backend
      - construccion-docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir que todas las comprobaciones hayan aprobado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          for resultado in $RESULTADOS; do
            if [ "$resultado" != success ]; then
              echo "Hay comprobaciones fallidas, canceladas u omitidas."
              exit 1
            fi
          done

  desplegar-staging:
    name: Desplegar - Staging
    needs:
      - validacion-completa
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Validar configuracion de staging
        shell: bash
        run: |
          : "${COOLIFY_WEBHOOK:?Falta COOLIFY_STAGING_WEBHOOK}"
          : "${COOLIFY_TOKEN:?Falta COOLIFY_TOKEN}"
          : "${APP_URL:?Falta STAGING_URL en el entorno staging}"

      - name: Solicitar despliegue en Coolify
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --output /dev/null \
            "${COOLIFY_WEBHOOK}"

      - name: Esperar y verificar staging
        shell: bash
        run: |
          sleep 60
          for intento in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              --output /dev/null \
              "${APP_URL%/}/health"; then
              echo "Staging responde correctamente."
              exit 0
            fi
            echo "Intento ${intento}/30: staging aun no esta listo."
            sleep 10
          done
          echo "Staging no supero la verificacion de salud."
          exit 1

  desplegar-produccion:
    name: Desplegar - Produccion
    needs:
      - desplegar-staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_URL: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Validar configuracion de produccion
        shell: bash
        run: |
          : "${COOLIFY_WEBHOOK:?Falta COOLIFY_PRODUCTION_WEBHOOK}"
          : "${COOLIFY_TOKEN:?Falta COOLIFY_TOKEN}"
          : "${APP_URL:?Falta PRODUCTION_URL en el entorno Production}"

      - name: Solicitar despliegue en Coolify
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --output /dev/null \
            "${COOLIFY_WEBHOOK}"

      - name: Esperar y verificar produccion
        shell: bash
        run: |
          sleep 60
          for intento in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              --output /dev/null \
              "${APP_URL%/}/health"; then
              echo "Produccion responde correctamente."
              exit 0
            fi
            echo "Intento ${intento}/30: produccion aun no esta lista."
            sleep 10
          done
          echo "Produccion no supero la verificacion de salud."
          exit 1
