name: CI REVO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarias-frontend:
    name: Unitarias - Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar unitarias
        working-directory: frontend
        run: npm run prueba:unidad

  unitarias-backend:
    name: Unitarias - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: comun
            directory: services/comun
            requirements: none

          - name: auth
            directory: services/auth-service
            requirements: services/auth-service/requirements.txt

          - name: survey
            directory: services/survey-service
            requirements: services/survey-service/requirements.txt

          - name: ml
            directory: services/ml-service
            requirements: services/ml-service/requirements.txt

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar libreria comun
        run: python -m pip install -e "./services/comun[test]"

      - name: Instalar dependencias del servicio
        if: matrix.requirements != 'none'
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Ejecutar unitarias
        working-directory: ${{ matrix.directory }}
        run: python -m pytest -q

  e2e-frontend:
    name: E2E - Frontend
    needs:
      - unitarias-frontend
      - unitarias-backend

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E
        working-directory: frontend
        run: npm run prueba:e2e

  integracion-backend:
    name: Integracion - ${{ matrix.name }}
    needs:
      - e2e-frontend

    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            directory: services/auth-service
            requirements: services/auth-service/requirements.txt
            database_user: revo_auth

          - name: survey
            directory: services/survey-service
            requirements: services/survey-service/requirements.txt
            database_user: revo_survey

          - name: ml
            directory: services/ml-service
            requirements: services/ml-service/requirements.txt
            database_user: revo_ml

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: revo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REVO_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revo_test
      REVO_TEST_DATABASE_URL: postgresql://${{ matrix.database_user }}:revo_ci_password@localhost:5432/revo_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar libreria comun
        run: python -m pip install -e "./services/comun[test]"

      - name: Instalar dependencias del servicio
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Preparar PostgreSQL efimero
        run: python pruebas/integracion/preparar_postgres.py

      - name: Ejecutar pruebas de integracion
        working-directory: ${{ matrix.directory }}
        run: python -m pytest pruebas/integracion -q -ra
