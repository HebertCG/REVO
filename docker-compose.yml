# ============================================================
# REVO — Despliegue con Docker Compose
# ============================================================
# Cambio principal frente a la version anterior: los microservicios YA NO
# publican puertos. Antes, `ports: 8001:8001` los dejaba accesibles desde
# cualquier maquina de la red, saltandose cualquier control de la pasarela.
# Ahora ningun contenedor publica puertos del host. En produccion, el proxy de
# Coolify alcanza Nginx por su puerto interno 80. El override de desarrollo
# publica Nginx solamente en 127.0.0.1:8080.
#
# Tres redes:
#   revo_publica  - solo Nginx. Es la frontera con el mundo.
#   revo_interna  - servicios, Postgres y Redis. `internal: true` significa
#                   que Docker no le da salida a internet: aunque un servicio
#                   se vea comprometido, no puede exfiltrar por su cuenta.
#   revo_salida   - salida a internet para el agente de cursos, y solo para
#                   el. Va con su propio rol de base de datos, que no alcanza
#                   ningun dato de alumnos (ver agente-cursos, mas abajo).
#
# Variables: ver .env.example. La sintaxis ${VAR:?mensaje} aborta el arranque
# si falta la variable, en vez de continuar con un valor de ejemplo.
# ============================================================

# Rotacion de logs para TODOS los contenedores.
#
# Sin esto Docker usa json-file sin limite: los logs crecen hasta llenar el
# disco. Medido en la prueba de carga del 2026-09-21: ~170 bytes por peticion
# de alumno, y ademas cada servicio escribe ~2 lineas por minuto de
# comprobaciones de salud AUNQUE NO HAYA NADIE (~200 MB al ano entre los tres).
# Con 3 ficheros de 10 MB, cada contenedor ocupa como mucho 30 MB.
x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─────────────────────────────────────────────
  # Pasarela — unico punto de entrada, publicado por el proxy de Coolify
  # ─────────────────────────────────────────────
  pasarela:
    build:
      context: .
      dockerfile: infraestructura/pasarela/Dockerfile
    image: revo-pasarela:local
    container_name: revo_pasarela
    logging: *registro
    restart: unless-stopped
    environment:
      # Coolify genera una URL publica para este servicio y la enruta al
      # puerto interno 80. Fuera de Coolify esta variable es inocua.
      SERVICE_URL_PASARELA_80: /
      GATEWAY_SECRET: ${SERVICE_PASSWORD_64_GATEWAY:?}
      # Hace que envsubst escriba el resultado en /etc/nginx/nginx.conf en
      # vez de en conf.d, que es lo que necesitamos al sustituir el fichero
      # principal completo.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    expose:
      - "80"
    depends_on:
      auth-service:
        condition: service_started
      survey-service:
        condition: service_started
      ml-service:
        condition: service_started
    networks:
      - revo_publica
      - revo_interna
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve
      # primero a ::1, y nginx solo escucha en IPv4. Con "localhost" la sonda
      # falla siempre aunque el servicio este perfectamente.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    # PostgreSQL 16 Alpine con pgvector compilado encima (ver el Dockerfile).
    # Misma base que antes a proposito: cambiar de libc sobre un volumen con
    # datos puede corromper el orden de los indices de texto sin avisar.
    build:
      context: ./infraestructura/postgres
    image: revo-postgres:16-pgvector
    container_name: revo_postgres
    logging: *registro
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revo_db}
      POSTGRES_USER: ${POSTGRES_USER:-revo_user}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      # Los consume database/16_asignar_passwords.sh para dar contrasena a
      # los roles que crean las migraciones 10 y 15.
      AUTH_DB_PASSWORD: ${SERVICE_PASSWORD_64_AUTH_DB:?}
      SURVEY_DB_PASSWORD: ${SERVICE_PASSWORD_64_SURVEY_DB:?}
      ML_DB_PASSWORD: ${SERVICE_PASSWORD_64_ML_DB:?}
      SERVICE_DB_PASSWORD: ${SERVICE_PASSWORD_64_SERVICE_DB:?}
      # La consume database/34_password_agente.sh.
      AGENTE_DB_PASSWORD: ${SERVICE_PASSWORD_64_AGENTE_DB:?}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # v6 fuerza una inicializacion limpia con contrasenas URL-safe para los
      # roles de servicio. Los volumenes anteriores quedan intactos en el host
      # para que el cambio sea recuperable.
      - postgres_data_v6:/var/lib/postgresql/data
      # El directorio completo se monta y se ejecuta en orden alfabetico:
      # 01 esquema, 02-09 datos, 10 RLS, 12 consentimiento, 13 alta de
      # alumnos, 14 cuentas, 15 roles por servicio, 16 contrasenas, ...,
      # 33 rol del agente, 34 su contrasena.
      #
      # ATENCION: database/ NO esta en el repositorio publico. En Coolify la
      # fuente debe ser una ruta absoluta explicita; si toda la fuente es una
      # variable, Coolify la normaliza como un volumen Docker vacio.
      - /home/klassia/revo-staging-v2/database:/docker-entrypoint-initdb.d:ro
    networks:
      - revo_interna
    # Sin `ports`: Postgres no asoma al exterior. Para inspeccionarlo en
    # desarrollo: docker compose exec postgres psql -U revo_user -d revo_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────
  # Redis — cupos de peticiones compartidos
  # ─────────────────────────────────────────────
  # Es lo que hace que el limite sea por alumno y no por worker: sin Redis,
  # cada proceso de uvicorn cuenta por su cuenta y el limite real se
  # multiplica por el numero de workers.
  redis:
    image: redis:7.2-alpine
    container_name: revo_redis
    logging: *registro
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS:?}
    command: >
      redis-server
      --requirepass ${SERVICE_PASSWORD_64_REDIS:?}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    networks:
      - revo_interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Los contadores de rate limit son efimeros por definicion: si Redis se
    # reinicia, se pierden y no pasa nada. Por eso no hay persistencia ni
    # volumen, y la politica de memoria descarta lo mas viejo.

  # ─────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────
  auth-service: &servicio_base
    build:
      # El contexto es ./services para que el Dockerfile pueda copiar
      # ./comun, que es la libreria compartida.
      context: ./services
      dockerfile: auth-service/Dockerfile
    container_name: revo_auth
    logging: *registro
    restart: unless-stopped
    environment: &entorno_base
      # Cada servicio entra con SU PROPIO rol, y ninguno es dueno de las
      # tablas: asi las politicas RLS le aplican (con revo_user, el dueno, se
      # las saltaria y todo el trabajo de RLS seria decorativo) y ademas solo
      # alcanza las tablas de su dominio. Con el rol compartido anterior, la
      # regla de "cada tabla la escribe un solo servicio" era una convencion
      # del codigo; ahora la impone el motor (ver 15_roles_por_servicio.sql).
      DATABASE_URL: postgresql://revo_auth:${SERVICE_PASSWORD_64_AUTH_DB:?}@postgres:5432/${POSTGRES_DB:-revo_db}
      REDIS_URL: redis://:${SERVICE_PASSWORD_64_REDIS:?}@redis:6379/0
      JWT_SECRET: ${SERVICE_REALBASE64_64_JWT:?}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      GATEWAY_SECRET: ${SERVICE_PASSWORD_64_GATEWAY:?}
      REQUIRE_GATEWAY: ${REQUIRE_GATEWAY:-true}
      # 1 = solo Nginx delante. Si se pone Cloudflare, sube a 2. Con el
      # numero mal puesto, el limite por IP cuenta contra el proxy y castiga
      # a todo el mundo por igual.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Entra en la cuenta del presupuesto de conexiones que el servicio
      # comprueba al arrancar contra el max_connections real de Postgres.
      WORKERS: ${WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_REQUIRE_SSL: ${DB_REQUIRE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - revo_interna
    # Sin `ports`: solo se llega por la pasarela.
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8001
      --no-server-header --proxy-headers --forwarded-allow-ips=*
      --workers ${WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Survey Service
  # ─────────────────────────────────────────────
  survey-service:
    <<: *servicio_base
    build:
      context: ./services
      dockerfile: survey-service/Dockerfile
    container_name: revo_survey
    environment:
      <<: *entorno_base
      DATABASE_URL: postgresql://revo_survey:${SERVICE_PASSWORD_64_SURVEY_DB:?}@postgres:5432/${POSTGRES_DB:-revo_db}
      ML_SERVICE_URL: http://ml-service:8003
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8002
      --no-server-header --proxy-headers --forwarded-allow-ips=*
      --workers ${WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # ML Service
  # ─────────────────────────────────────────────
  ml-service:
    <<: *servicio_base
    build:
      context: ./services
      dockerfile: ml-service/Dockerfile
    container_name: revo_ml
    environment:
      <<: *entorno_base
      DATABASE_URL: postgresql://revo_ml:${SERVICE_PASSWORD_64_ML_DB:?}@postgres:5432/${POSTGRES_DB:-revo_db}
      # El entrenamiento corre en segundo plano, sin alumno detras, y usa su
      # propio rol: asi una tarea de fondo no hereda los permisos de las
      # rutas que atienden peticiones.
      SERVICE_DATABASE_URL: postgresql://revo_service:${SERVICE_PASSWORD_64_SERVICE_DB:?}@postgres:5432/${POSTGRES_DB:-revo_db}
      MODEL_PATH: /app/model/saved/decision_tree.pkl
    volumes:
      - ml_models:/app/model/saved
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8003
      --no-server-header --proxy-headers --forwarded-allow-ips=*
      --workers ${WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────
  # Agente de cursos — una tarea, no un servicio
  # ─────────────────────────────────────────────
  # No arranca con `docker compose up`: se lanza, hace su pasada y termina.
  #
  #     docker compose --profile tareas run --rm agente-cursos
  #
  # En el VPS, una vez al dia por cron (ver agente_cursos/__main__.py).
  #
  # Es el UNICO contenedor con salida a internet aparte de la pasarela, y por
  # eso va separado de ml-service y con su propio rol. Descarga texto que
  # escribe cualquiera; si se viera comprometido, no puede tener a la vez los
  # datos de los alumnos y una salida por la que sacarlos. revo_agente solo
  # alcanza sus dos tablas, y la migracion 33 lo verifica.
  agente-cursos:
    build:
      context: ./services
      dockerfile: ml-service/Dockerfile
    profiles: ["tareas"]
    logging: *registro
    restart: "no"
    environment:
      DATABASE_URL: postgresql://revo_agente:${SERVICE_PASSWORD_64_AGENTE_DB:?}@postgres:5432/${POSTGRES_DB:-revo_db}
      DB_REQUIRE_SSL: ${DB_REQUIRE_SSL:-false}
    command: ["python", "-m", "agente_cursos"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - revo_interna
      - revo_salida

networks:
  revo_publica:
    driver: bridge
  # Salida a internet solo para el agente de cursos.
  revo_salida:
    driver: bridge
  revo_interna:
    driver: bridge
    # Sin salida a internet. Un servicio comprometido no puede sacar datos
    # por su cuenta ni descargarse herramientas.
    internal: true

volumes:
  postgres_data_v6:
  ml_models:
