<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Marca de REVO reducida a la inicial. El fondo es transparente a
    proposito, para que la pestana del navegador se vea a traves.

    La R es blanca por defecto, que es lo correcto sobre la barra oscura.
    El bloque de abajo la oscurece cuando el navegador esta en tema claro,
    donde una R blanca desapareceria sobre la pestana.
  -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="M7 3.5h11.4c4.6 0 7.8 3 7.8 7.4 0 3.3-1.9 5.9-4.9 6.9L27 28.5h-7.2l-4.6-9.7h-2.1v9.7H7V3.5Zm6.1 5.2v5.4h5c1.9 0 3.1-1.1 3.1-2.7s-1.2-2.7-3.1-2.7h-5Z"
  />
  <style>
    @media (prefers-color-scheme: light) {
      path { fill: #0b0b0d; }
    }
  </style>
</svg>
