# ============================================================
# REVO - Despliegue en Render
# ============================================================
# AVISO SOBRE EL PLAN GRATUITO
#
# Los cuatro servicios estan en `plan: free`. Render duerme un servicio
# gratuito tras 15 minutos sin trafico y tarda unos 50 segundos en
# despertarlo. Aqui hay una cadena de cuatro (navegador -> pasarela ->
# servicio), asi que la primera peticion despues de un rato puede tardar
# bastante y parecer que la aplicacion esta rota.
#
# Para una sustentacion: entra unos minutos antes y navega una pantalla de
# cada servicio para dejarlos despiertos.
#
# La base de datos va en Supabase, no en Render. Ver docs/DESPLIEGUE_SUPABASE.md
# ============================================================
# Alternativa gestionada al despliegue con Docker Compose. El mismo codigo
# corre en los dos sitios: lo unico que cambia son las variables de entorno.
#
# Diferencia importante con el compose: en Render cada servicio es una URL
# publica. No hay red interna en el plan gratuito, asi que el aislamiento por
# red no existe y TODA la defensa de "ninguna API expuesta" recae en el
# secreto de pasarela (REQUIRE_GATEWAY + GATEWAY_SECRET). Por eso aqui es
# obligatorio, no opcional.
#
# Antes de desplegar hay que crear a mano en el panel de Render:
#   1. Un PostgreSQL gestionado.
#   2. Un Redis (o una instancia de Upstash) para los cupos de peticiones.
#   3. Aplicar TODAS las migraciones de database/ en orden y dar contrasena
#      a los roles que crean: revo_auth, revo_survey, revo_ml y revo_service.
#      El runbook completo esta en docs/DESPLIEGUE_NUBE.md.
#
# IMPORTANTE: cada servicio usa SU PROPIO rol en DATABASE_URL, no uno
# compartido. Es lo que impide que el cuestionario pueda leer la tabla de
# usuarios (ver database/15_roles_por_servicio.sql).
#
# Los valores marcados con `sync: false` NO se versionan: se escriben en el
# panel de Render. Es la razon de que no haya ningun secreto en este fichero.
# ============================================================

services:
  # ─────────────────────────────────────────────
  # Pasarela — el unico servicio que deberia recibir trafico del navegador
  # ─────────────────────────────────────────────
  - type: web
    name: revo-pasarela
    runtime: docker
    plan: free
    dockerfilePath: ./infraestructura/pasarela/Dockerfile.render
    dockerContext: ./infraestructura/pasarela
    envVars:
      - key: GATEWAY_SECRET
        sync: false
      - key: URL_AUTH
        sync: false
      - key: URL_SURVEY
        sync: false
      - key: URL_ML
        sync: false

  # ─────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-auth-service
    runtime: python
    plan: free
    rootDir: services/auth-service
    # `pip install ../comun` instala la libreria compartida. Render clona el
    # repositorio completo, asi que la ruta relativa existe aunque rootDir
    # apunte a este subdirectorio.
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      # Con revo_auth, NO con el dueno de las tablas: es lo que hace que las
      # politicas RLS apliquen de verdad.
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      # Obligatorio en Render: sin red privada, es lo unico que impide llamar
      # al servicio directamente por su URL publica.
      - key: REQUIRE_GATEWAY
        value: "true"
      # Render pone su propio balanceador delante, y la pasarela anade otro
      # salto: dos proxies de confianza.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false

  # ─────────────────────────────────────────────
  # Survey Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-survey-service
    runtime: python
    plan: free
    rootDir: services/survey-service
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: REQUIRE_GATEWAY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      - key: ML_SERVICE_URL
        sync: false

  # ─────────────────────────────────────────────
  # ML Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-ml-service
    runtime: python
    plan: free
    rootDir: services/ml-service
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: REQUIRE_GATEWAY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      # El modelo entrenado necesita sobrevivir a los reinicios: sin disco,
      # cada despliegue vuelve a entrenar desde cero al arrancar.
      - key: MODEL_PATH
        value: /var/data/modelo/decision_tree.pkl
    disk:
      name: modelo
      mountPath: /var/data/modelo
      sizeGB: 1
