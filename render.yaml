# ============================================================
# REVO - Despliegue en Render
# ============================================================
# ============================================================
# AVISO SOBRE EL PLAN GRATUITO
#
# Los cuatro servicios estan en `plan: free`. Render duerme un servicio
# gratuito tras 15 minutos sin trafico y tarda unos 50 segundos en
# despertarlo. Aqui hay una cadena de cuatro (navegador -> pasarela ->
# servicio), asi que la primera peticion despues de un rato puede tardar
# bastante y parecer que la aplicacion esta rota.
#
# Para una sustentacion, diez minutos antes:
#     bash infraestructura/render/calentar.sh https://TU-PASARELA.onrender.com
# Despierta los cuatro y dice cuales estan en pie.
#
# La base de datos va en Supabase, no en Render.
# ============================================================
# Alternativa gestionada al despliegue con Docker Compose. El mismo codigo
# corre en los dos sitios: lo unico que cambia son las variables de entorno.
#
# Diferencia importante con el compose: en Render cada servicio es una URL
# publica. No hay red interna en el plan gratuito, asi que el aislamiento por
# red no existe y TODA la defensa de "ninguna API expuesta" recae en el
# secreto de pasarela (REQUIRE_GATEWAY + GATEWAY_SECRET). Por eso aqui es
# obligatorio, no opcional.
#
# La base de datos NO se crea en Render: esta en Supabase, con el esquema y
# los cuatro roles ya instalados. Tampoco hace falta Redis: con REDIS_URL
# vacia, los cupos de peticiones se cuentan en memoria del proceso, y con
# una sola instancia por servicio eso es correcto.
#
# Lo unico que hay que escribir a mano en el panel son los valores marcados
# con `sync: false`, y las tres URL de la pasarela, que no existen hasta que
# Render crea los servicios.
#
# IMPORTANTE: cada servicio usa SU PROPIO rol en DATABASE_URL, no uno
# compartido. Es lo que impide que el cuestionario pueda leer la tabla de
# usuarios (ver database/15_roles_por_servicio.sql).
#
# Los valores marcados con `sync: false` NO se versionan: se escriben en el
# panel de Render. Es la razon de que no haya ningun secreto en este fichero.
# ============================================================

services:
  # ─────────────────────────────────────────────
  # Pasarela — el unico servicio que deberia recibir trafico del navegador
  # ─────────────────────────────────────────────
  - type: web
    name: revo-pasarela
    runtime: docker
    plan: free
    dockerfilePath: ./infraestructura/pasarela/Dockerfile.render
    dockerContext: ./infraestructura/pasarela
    envVars:
      - key: GATEWAY_SECRET
        sync: false
      - key: URL_AUTH
        sync: false
      - key: URL_SURVEY
        sync: false
      - key: URL_ML
        sync: false

  # ─────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-auth-service
    runtime: python
    plan: free
    rootDir: services/auth-service
    # `pip install ../comun` instala la libreria compartida. Render clona el
    # repositorio completo, asi que la ruta relativa existe aunque rootDir
    # apunte a este subdirectorio.
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      # Con revo_auth, NO con el dueno de las tablas: es lo que hace que las
      # politicas RLS apliquen de verdad.
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      # Obligatorio en Render: sin red privada, es lo unico que impide llamar
      # al servicio directamente por su URL publica.
      - key: REQUIRE_GATEWAY
        value: "true"
      # Render pone su propio balanceador delante, y la pasarela anade otro
      # salto: dos proxies de confianza.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false

  # ─────────────────────────────────────────────
  # Survey Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-survey-service
    runtime: python
    plan: free
    rootDir: services/survey-service
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: REQUIRE_GATEWAY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      - key: ML_SERVICE_URL
        sync: false

  # ─────────────────────────────────────────────
  # ML Service
  # ─────────────────────────────────────────────
  - type: web
    name: revo-ml-service
    runtime: python
    plan: free
    rootDir: services/ml-service
    buildCommand: "pip install -r requirements.txt && pip install ../comun"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers --forwarded-allow-ips=*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_SECRET
        sync: false
      - key: REQUIRE_GATEWAY
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      # El modelo viaja versionado en el repositorio, asi que al arrancar
      # existe y se carga sin reentrenar (ver preparar_modelo en main.py).
      #
      # Antes habia aqui un disco de 1 GB en /var/data/modelo para que un
      # modelo REENTRENADO sobreviviera a los reinicios. El plan gratuito
      # de Render no admite discos y el Blueprint se niega a crearse con
      # uno, asi que se quito: un reentrenamiento lanzado desde el panel
      # de administracion dura lo que dure esa instancia y se pierde al
      # reiniciarse. El modelo del repositorio siempre vuelve.
      #
      # Si el reentrenamiento pasa a usarse de verdad, el sitio del modelo
      # no es el disco local sino un almacenamiento externo.
      - key: MODEL_PATH
        value: model/saved/decision_tree.pkl
